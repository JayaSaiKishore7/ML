name: ML Projects CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test-churn-prediction:
    name: Test Churn Prediction
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        cd churn_prediction
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        cd churn_prediction
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./churn_prediction/coverage.xml
        flags: churn_prediction
        name: churn-prediction-coverage

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
    
    - name: Run flake8
      run: |
        flake8 churn_prediction/src --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 churn_prediction/src --count --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check formatting with black
      run: |
        black --check churn_prediction/src
    
    - name: Check import sorting
      run: |
        isort --check-only churn_prediction/src

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test-churn-prediction, lint]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      run: |
        cd churn_prediction/deployment
        docker build -t churn-prediction-api:latest .
    
    - name: Test Docker image
      run: |
        docker run -d --name test-api -p 5000:5000 churn-prediction-api:latest || true
        sleep 10
        curl -f http://localhost:5000/health || exit 1
        docker stop test-api
